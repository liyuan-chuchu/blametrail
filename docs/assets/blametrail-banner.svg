<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">BlameTrail</title>
  <desc id="desc">The evidence trail behind every line of code</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d18"/>
      <stop offset="0.55" stop-color="#11182c"/>
      <stop offset="1" stop-color="#15102b"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" rx="32" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="32" fill="url(#grid)"/>
  <circle cx="1120" cy="86" r="190" fill="#7c3aed" opacity=".08"/>
  <circle cx="90" cy="590" r="230" fill="#0891b2" opacity=".07"/>

  <g transform="translate(104 104)">
    <path d="M32 42H122C154 42 164 74 190 74H284C313 74 329 107 357 107H440" fill="none" stroke="#1e293b" stroke-width="19" stroke-linecap="round"/>
    <path d="M32 42H122C154 42 164 74 190 74H284C313 74 329 107 357 107H440" fill="none" stroke="url(#trail)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
    <g fill="#0f172a" stroke-width="5">
      <circle cx="32" cy="42" r="15" stroke="#22d3ee"/>
      <circle cx="190" cy="74" r="15" stroke="#6366f1"/>
      <circle cx="357" cy="107" r="15" stroke="#a855f7"/>
      <circle cx="440" cy="107" r="15" stroke="#c084fc"/>
    </g>
    <g fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">
      <text x="6" y="5">line</text>
      <text x="158" y="37">commit</text>
      <text x="336" y="70">PR</text>
      <text x="418" y="70">issue</text>
    </g>
  </g>

  <text x="104" y="360" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="92" font-weight="750" letter-spacing="-4">BlameTrail</text>
  <text x="108" y="423" fill="#a5b4fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="500">The evidence trail behind every line of code.</text>

  <g transform="translate(106 480)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">
    <rect width="690" height="74" rx="14" fill="#070b13" stroke="#334155"/>
    <circle cx="30" cy="24" r="5" fill="#fb7185"/>
    <circle cx="49" cy="24" r="5" fill="#facc15"/>
    <circle cx="68" cy="24" r="5" fill="#4ade80"/>
    <text x="28" y="54" fill="#64748b">$</text>
    <text x="50" y="54" fill="#e2e8f0">blametrail explain src/auth.ts:42</text>
  </g>

  <g transform="translate(926 304)">
    <rect width="250" height="250" rx="32" fill="#0b1120" stroke="#312e81" stroke-width="2"/>
    <path d="M53 62H197M53 103H155M53 144H181M53 185H132" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
    <path d="M53 103H155" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="53" cy="103" r="12" fill="#0b1120" stroke="#22d3ee" stroke-width="5"/>
    <path d="M155 103C194 103 183 144 181 144" fill="none" stroke="url(#trail)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="181" cy="144" r="12" fill="#0b1120" stroke="#c084fc" stroke-width="5"/>
  </g>
</svg>
